name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Install nasm
        run: sudo apt-get update && sudo apt-get install -y nasm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Library builds without the CLI feature
        run: cargo clippy --lib --no-default-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install nasm (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Install nasm (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm
      - name: Install nasm (Windows x86_64)
        if: runner.os == 'Windows' && runner.arch == 'X64'
        run: choco install nasm -y --no-progress
      - name: Add nasm to PATH (Windows x86_64)
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: bash
        run: echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Install nasm
        run: sudo apt-get update && sudo apt-get install -y nasm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked

  musl:
    # Release binaries for Linux are static musl builds; catch breakage before a tag.
    name: build (linux musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
      - name: Install musl-tools and nasm
        run: sudo apt-get update && sudo apt-get install -y musl-tools nasm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Smoke test
        run: |
          ./target/x86_64-unknown-linux-musl/release/susut --version
          file ./target/x86_64-unknown-linux-musl/release/susut

  deny:
    name: licenses + advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
