[package]
name = "susut"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fast CLI to compress, resize and convert images (JPEG, PNG, WebP, AVIF) to a target file size"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thetasdev/susut"
homepage = "https://github.com/thetasdev/susut"
readme = "README.md"
authors = ["Ikrom <ikrom@thetas.dev>"]
keywords = ["image", "compression", "cli", "jpeg", "webp"]
categories = ["command-line-utilities", "multimedia::images"]
exclude = [".github/", ".cargo/", "docs/", "scripts/", "target/"]

[features]
default = ["cli"]
# Command-line front end; the library alone has no clap dependency.
cli = ["dep:clap", "dep:walkdir"]

[[bin]]
name = "susut"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
fast_image_resize = "6.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "rayon"] }
mozjpeg = "0.10.13"
oxipng = { version = "10.2.1", default-features = false, features = ["parallel"] }
ravif = { version = "0.13.0", default-features = false, features = ["threading"] }
rayon = "1.12.0"
rgb = "0.8.53"
walkdir = { version = "2.5.0", optional = true }
webp = "0.3.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

# rav1e's hand-written ARM assembly (.S files) cannot be built by MSVC on Windows ARM64,
# so SIMD assembly is enabled everywhere except there (AVIF encoding is slower on that target).
[target.'cfg(not(all(windows, target_arch = "aarch64")))'.dependencies]
ravif = { version = "0.13.0", default-features = false, features = ["threading", "asm"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
